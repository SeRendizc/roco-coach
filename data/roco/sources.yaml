    archive_committed_to_git: false
    archive_committed_reason: >
      该归档为 172MB。放进 git 会永久留在历史里、之后无法真正移除，代价远大于收益。
      它的角色只是**交叉核验的第二来源**，其数值不进入 normalized/（许可未确认，
      标 REFERENCE_ONLY），因此不随仓库分发不会让任何已交付结论失去依据。
      需要复现时按 archive_url 重新下载，并用下面的 SHA256 核对。
