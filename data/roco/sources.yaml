# 《洛克王国：世界》手游数据来源清单（M1）
#
# 用途：本文件是 `data/roco/` 下所有规范化数据的来源台账。
# 规则：
#   1. 只登记《洛克王国：世界》手游（roco_world_mobile）来源。页游资料一律不得进入本文件。
#   2. 每条来源必须有固定的 revision（commit SHA），不得写「最新」。
#   3. SHA256 是**下载到的归档文件**的哈希；解压后逐文件哈希见
#      `reports/roco/m1-data/snapshot-file-inventory.json`。
#   4. license 与 redistribution 必须分别标注；未确认的标 REFERENCE_ONLY。
#   5. verification_status 只描述「我们核验到哪一步」，不描述上游权威性。
#
# 生成方式：scripts/roco/fetch-sources.mjs（下载）+ scripts/roco/hash-snapshot.mjs（逐文件哈希）
# 本轮抓取时间：2026-09-20T16:15Z（UTC）

schema_version: 1
game: roco_world_mobile
game_name_zh: 洛克王国：世界
generated_at: "2026-09-20T16:16:00Z"

# 本轮冻结的 ruleset。所有 normalized 数据都归属它。
ruleset:
