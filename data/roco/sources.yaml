    license: CC-BY-NC-SA-4.0
    license_evidence: data/roco/raw/extracted/rocom-wiki-data/LICENSE
    license_note: >
      仓库自带 LICENSE 为 CC BY-NC-SA 4.0（署名-非商业性使用-相同方式共享）。
      上游 WIKI 内容同为 CC BY-NC-SA 4.0。GitHub API 的 license 字段返回
      NOASSERTION/Other，因为该 LICENSE 是自定义排版的中文全文，不是 SPDX 原文；
      以仓库内 LICENSE 文件正文为准。
    redistribution: DERIVE_WITH_ATTRIBUTION_NONCOMMERCIAL
    attribution_required: true
