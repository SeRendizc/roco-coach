# 明确被排除的来源类型（防止页游数据混入）
excluded_source_classes:
  - class: 页游 roco.qq.com / 洛克王国页游 wiki
    reason: 用户硬性要求：只使用手游数据。页游精灵名可能重名，机制不同。
  - class: 宝可梦 / Pokémon 数据
    reason: 与本作机制无来源关系；不得作为伤害或时序的替代证据。
  - class: 未标版本的二手攻略转载
    reason: 无法固定 revision，无法计算 hash，不可追溯。

