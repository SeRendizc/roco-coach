<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小芽 · 精灵盒子（我的 / 全图鉴）</title><link rel="stylesheet" href="/src/client/style.css"><link rel="stylesheet" href="/src/client/box.css"></head><body>
<div id="boot-fallback" class="boot-fallback" role="alert">页面脚本没有加载成功：本机服务可能还是<strong>旧版本</strong>（静态资源清单在进程启动时就定下了）。请在仓库根目录重启 <code>npm start</code>，然后刷新这一页；开发者抽屉里能看到服务进程的启动时间与资源清单规模。</div>

<main>

<!-- ── 页头：只放标题、数据快照与「关于这一页」抽屉 ─────────────────────────────
     工程信息（来源 / 版本 / 覆盖 / 未知字段 / 许可）**全部**在 `#dev-drawer` 里，默认收起。
     一句话口径：页面上不出现工程字段，抽屉里才出现。 -->
<header class="topbar">
 <h1>小芽 · 精灵盒子 <small>全部精灵 / 我的盒子</small></h1>
 <div class="header-actions">
  <!-- 2026-09-25（人类：「返回培养页没做」）：这一页原来只有状态/重置/关于 —— 从盒子里
       既回不去首页、也去不了培养。补上与其他页同一套 `.nav-btn`（顺序：返回首页 / 去培养 / 开始PVP），
       小芽仍由 `xiaoya.js` 注入同一行。 -->
  <a class="nav-btn" id="box-nav-home" href="/">← 返回首页</a>
  
  <a class="nav-btn primary" id="box-nav-pvp" href="/roco.html">⚔ 开始 PVP</a>
  <span id="box-status" class="chip">正在读取…</span>
  <button id="box-reset">重置筛选</button>
  <details class="dev" id="dev-drawer">
   <summary>关于这一页（来源与快照）</summary>
   <div class="dev-body" id="dev-body">
    <p class="muted">打开后按当前视图生成。这里放的是工程字段，玩家区域一个都不显示。</p>
   </div>
  </details>
 </div>
</header>

<!-- ── 第一层：列表（标签 / 搜索筛选 / 卡片网格 / 分页 / 比选栏）─────────────────
     2026-09-28（人类：「比较页面也莫名其妙，加在下面你觉得很好看？为啥不做成二级页面」）：
     比较结果**不再画在列表下面**，改成下面那个第二级视图（`#compare-view`）。
     这一个 div 是首层的壳：进比较页时整块 `hidden`，返回时原样回来。 -->
<div id="box-list-view">

<!-- ── 两个主标签：我的盒子 / 全图鉴 ─────────────────────────────────────────── -->
<nav class="tabs" role="tablist" aria-label="精灵盒子的两个视图">
 <button class="tab selected" id="tab-mine" data-kind="mine" role="tab" aria-selected="true">
  我的盒子 <span class="tab-count" id="count-mine">—</span></button>
 <button class="tab" id="tab-catalog" data-kind="catalog" role="tab" aria-selected="false">
  全部精灵 <span class="tab-count" id="count-catalog">—</span></button>
</nav>

<!-- ── 搜索 / 筛选 / 分页 ──────────────────────────────────────────────────────
     筛选用页内折叠菜单而不是原生 `<select>`：原生下拉在无头浏览器里打不开也按不动，
     那样「筛选」这一条就写不出真实键鼠判据（做法与训练场页一致）。 -->
<section class="panel box-toolbar">
 <input type="search" id="box-search" placeholder="搜索名字" aria-label="按名字搜索" autocomplete="off">
 <details class="fmenu" id="menu-type">
  <summary>系别：<span id="label-type">全部</span></summary>
  <div class="fmenu-body" id="filter-type" role="group" aria-label="按系别筛选"></div>
 </details>
 <details class="fmenu" id="menu-role">
  <summary>定位：<span id="label-role">全部</span></summary>
  <div class="fmenu-body" id="filter-role" role="group" aria-label="按定位筛选"></div>
 </details>
 <details class="fmenu" id="menu-support">
  <summary>支持等级：<span id="label-support">全部</span></summary>
  <div class="fmenu-body" id="filter-support" role="group" aria-label="按支持等级筛选"></div>
 </details>
 <div class="flags" id="mine-flags" role="group" aria-label="按收藏筛选">
  <button id="flag-favourite" aria-pressed="false">只看收藏</button>
 </div>
 <span class="muted" id="box-count">正在读取…</span>
</section>

<!-- ── 卡片网格：一行是**一个种类**（我的盒子）或一个图鉴条目 ─────────────────────
     2026-09-28（人类 ④⑤）：「第一排和第二配信息显示冗余」「这个选单不知道自己瘦回去吗？
     全部重在一起」⇒ 行里只留信息（等级 / 性格 / 天分 / 收藏星标），
     动作（看详情 / 加入比较 / 刷新 / 回滚 / 再养一只 / 删掉）全部搬进二级详情页（`#pet-view`）。 -->
<section class="panel box-main">
 <div id="box-grid" class="box-grid"></div>
 <p class="muted box-empty" id="box-empty" hidden>没有符合条件的伙伴：换个系别、清掉搜索词再试。</p>
 <div class="pager">
  <button id="page-prev">上一页</button>
  <span id="page-label">1 / 1</span>
  <button id="page-next">下一页</button>
 </div>
</section>


</div><!-- /#box-list-view -->


<!-- ── 第二级视图：个体详情页（地址 `?pet=<这一只自己的编号>`）──────────────────────
     2026-09-28（人类 ②③）：「没有个按钮能弹出个二级页面展示完整六维属性」「刷新性格、天分、
     再加一只啥的这个太大了，而且没有提供有效信息，是不是最好放二级页面去？」⇒ 这一屏就是二级页：
     完整六维（生命/物攻/物防/魔攻/魔防/速度）、性格、天分档位与最高两项、等级、资质六维、
     四个技能，以及刷新 / 回滚 / 再养一只 / 删掉（两步确认）这些动作。
     地址带这一只：刷新、前进后退、书签都能回到同一屏（做法与上面那一屏一模一样）。 -->
<section class="panel pet-view" id="pet-view" hidden aria-labelledby="pet-title">
 <div class="section-title pet-view-head">
  <button class="nav-btn primary" id="pet-back">← 返回精灵盒子</button>
  <h2 id="pet-title">这一只的详情</h2>
 </div>
 <p class="cmp-trouble" id="pet-note" role="status" aria-live="polite" hidden></p>
 <!-- ── 2026-09-29（U02）两区版式 ─────────────────────────────────────────────
      宽屏：左栏 = 紧凑精灵摘要（形象 / 名称 / 属性 / 等级 / 性格 / 资质 / 天分 / 刷新记录）
      + 动作按钮；右栏 = **唯一一组**「当前四个技能」（`#pet-loadout`）+ 六维。
      窄屏（≤880px）：单列，顺序照读（摘要 → 动作 → 四技能 → 六维）。
      ⚠ `#pet-loadout` 是**静态**宿主：`renderPetPage()` 每次重画只换 innerHTML，
        不重建它 —— 挑到一半的候选不会因为刷新一次就丢（挂载是幂等的，见 box-loadout.js）。 -->
 <div class="pet-cols">
  <div class="pet-side">
   <div id="pet-head"></div>
   <div class="pet-actions" id="pet-actions"></div>
  </div>
  <div class="pet-main">
   <div id="pet-loadout"></div>
   <div id="pet-body"></div>
  </div>
 </div>
</section>

</main>

<script type="module" src="/src/client/box.js"></script>
</body></html>
